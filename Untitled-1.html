<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renault Clio 0.9 TCe - Moj Auto</title>
    <style>
        :root {
            --primary: #e63946; 
            --dark: #121212;
            --card-bg: #1e1e1e;
            --light: #f1faee;
        }

        body, html {
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--light);
            scroll-behavior: smooth;
        }

        nav {
            position: fixed; 
            top: 0; 
            width: 100%;
            background: rgba(18, 18, 18, 0.6);
            padding: 1rem 0; 
            z-index: 100;
            display: flex; 
            justify-content: space-around;
            align-items: center; 
            backdrop-filter: blur(10px);
            transition: all 0.3s ease-in-out;
        }
        nav h1 { 
            margin: 0; 
            font-size: 1.5rem; 
            color: var(--primary); 
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        nav ul { 
            list-style: none; 
            display: flex; 
            gap: 2rem; 
            margin: 0; 
            padding: 0; 
        }
        nav ul li a { 
            color: var(--light); 
            text-decoration: none; 
            font-weight: 600; 
            transition: color 0.3s;
            text-transform: uppercase;
            font-size: 0.9rem;
        }
        nav ul li a:hover { 
            color: var(--primary); 
        }

        .hero {
            height: 100vh;
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(18,18,18,1)), url('_DSC0033.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .hero h2 { 
            font-size: 4rem; 
            margin-bottom: 10px; 
            letter-spacing: 3px;
        }
        .hero p { 
            font-size: 1.5rem; 
            color: #ccc; 
            margin-top: 0;
        }

        .section { 
            padding: 80px 20px; 
            max-width: 1200px; 
            margin: auto; 
        }
        .section-title { 
            text-align: center; 
            font-size: 2.5rem; 
            margin-bottom: 50px; 
            color: var(--primary); 
            text-transform: uppercase;
        }

        .specs-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 20px;
        }
        .spec-card {
            background: var(--card-bg); 
            padding: 25px 20px; 
            border-radius: 10px;
            text-align: center; 
            border-bottom: 4px solid var(--primary);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .spec-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 10px 20px rgba(230, 57, 70, 0.2);
        }
        .spec-card h3 { 
            margin-top: 0; 
            color: #aaa; 
            font-size: 1.1rem;
            text-transform: uppercase;
        }
        .spec-card p { 
            font-size: 1.5rem; 
            font-weight: bold; 
            margin: 10px 0 0 0; 
        }

        .gallery-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 15px;
        }
        .gallery-item {
            width: 100%; 
            height: 250px; 
            object-fit: cover; 
            border-radius: 8px;
            cursor: pointer; 
            transition: transform 0.3s, filter 0.3s;
        }
        .gallery-item:hover { 
            transform: scale(1.03); 
            filter: brightness(1.2); 
        }
        
        .lightbox {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            top: 0; 
            left: 0;
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.9);
            justify-content: center; 
            align-items: center;
        }
        .lightbox img { 
            max-width: 90%; 
            max-height: 90%; 
            border-radius: 10px; 
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .lightbox-close {
            position: absolute; 
            top: 20px; 
            right: 40px; 
            font-size: 50px;
            color: white; 
            cursor: pointer;
            transition: color 0.3s;
        }
        .lightbox-close:hover {
            color: var(--primary);
        }

        footer { 
            text-align: center; 
            padding: 30px; 
            background: #0a0a0a; 
            border-top: 1px solid #333; 
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <nav id="navbar">
        <h1>Clio 0.9 TCe</h1>
        <ul>
            <li><a href="#pocetna">Početna</a></li>
            <li><a href="#specifikacije">Specifikacije</a></li>
            <li><a href="#galerija">Galerija</a></li>
        </ul>
    </nav>

    <section id="pocetna" class="hero">
        <h2>Renault Clio (2014)</h2>
        <p>0.9 TCe | 90 KS | 135 Nm</p>
    </section>

    <section id="specifikacije" class="section">
        <h2 class="section-title">Tehničke Specifikacije</h2>
        <div class="specs-grid">
            <div class="spec-card">
                <h3>Motor</h3>
                <p>0.9 TCe (898 cm³)<br>3 cilindra, Turbo</p>
            </div>
            <div class="spec-card">
                <h3>Snaga</h3>
                <p>90 KS (66 kW)<br><span style="font-size:1rem; font-weight:normal;">pri 5250 o/min</span></p>
            </div>
            <div class="spec-card">
                <h3>Obrtni moment</h3>
                <p>135 Nm<br><span style="font-size:1rem; font-weight:normal;">pri 2500 o/min</span></p>
            </div>
            <div class="spec-card">
                <h3>Ubrzanje (0-100 km/h)</h3>
                <p>12.2 s</p>
            </div>
            <div class="spec-card">
                <h3>Maks. brzina</h3>
